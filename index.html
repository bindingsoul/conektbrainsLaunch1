<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1F3A51, #3C3E43);
            font-family: 'Playfair Display', serif;
        }

        .button-container {
            text-align: center;
            color: #F1F1F1;
        }

        .button {
            padding: 15px 30px;
            margin: 15px;
            font-size: 18px;
            cursor: pointer;
            background: linear-gradient(135deg, #1F3A51, #3C3E43);
            color: #F1F1F1;
            border: 1px solid #A7A9B3;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .button:hover {
            background: linear-gradient(135deg, #3C3E43, #1F3A51);
            border-color: #F0F0F0;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(31, 58, 81, 0.3);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="button-container">
        <button class="button" onclick="window.location.href='game/game.html'">Play Game</button>
        <button class="button" onclick="window.location.href='design_res/design.html'">DesignRes</button>
    </div>
</body>
</html>
